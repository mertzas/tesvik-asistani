name: Tests

# Denetim 2026-10-07: onceki is akisi PostgreSQL URL'siyle psycopg2'siz requirements.txt
# kuruyor (import aninda cokuyor), black/isort/mypy'yi zorunlu tutuyor (kod tabani bu
# bicimleyicilerle yazilmadi) ve Codecov token'siz yukleme deniyordu -> her kosu kirmizi,
# kimse bakmiyordu. Simdi: testler SQLite ile (conftest bellek-ici DB kullanir),
# flake8 yalnizca gercek hatalar (sozdizimi, tanimsiz ad), bandit raporu bilgi amacli.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
          PYTHONIOENCODING: utf-8
          # `pytest tests/` proje kokunu sys.path'e eklemiyor (ModuleNotFoundError: app, run 37623581221);
          # `python -m pytest` cwd'yi ekler.
          PYTHONPATH: .
        run: python -m pytest tests/ -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install flake8
        run: pip install flake8
      # Yalnizca gercek hatalar: sozdizimi (E9), tanimsiz ad (F821), kullanilmayan import (F401) vb.
      - name: Flake8 (hata siniflari)
        run: flake8 app/ tests/ scripts/ --select=E9,F63,F7,F82,F401,F811 --show-source

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bandit
        run: |
          pip install bandit
          bandit -r app/ -ll -q || true

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: false
          tags: tesvik-asistani:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
