<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Çilek Üretim Yönetim Paneli</title>
<!-- Tailwind önceden derlenir (CSP: dış betik yok). Yeniden derleme: tools/tailwind/tailwind.config.js -->
<link rel="stylesheet" href="/static/css/cilek.css">
<style>
  /* Tarlada, güneş altında okunabilirlik için: yüksek kontrast, büyük tipografi. */
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#0f172a; }
  .risk-guvenli   { background:#15803d; color:#fff; border-color:#166534; }
  .risk-riskli    { background:#ca8a04; color:#fff; border-color:#854d0e; }
  .risk-kritik    { background:#b91c1c; color:#fff; border-color:#7f1d1d; animation: pulse-kritik 1.6s ease-in-out infinite; }
  .risk-veri_yok  { background:#475569; color:#e2e8f0; border-color:#334155; }
  @keyframes pulse-kritik { 0%,100% { box-shadow: 0 0 0 0 rgba(185,28,28,.6);} 50% { box-shadow: 0 0 0 10px rgba(185,28,28,0);} }
  .big-num { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
</style>
</head>
<body class="min-h-screen text-slate-100 pb-24">

  <!-- ÜST BAR: parsel seçici + bağlantı durumu -->
  <div class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-700 px-4 py-3">
    <div class="flex items-center justify-between gap-3 max-w-3xl mx-auto">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-2xl">🍓</span>
        <select id="parsel-secici" class="bg-slate-800 text-slate-100 text-lg font-bold rounded-lg px-3 py-2 border border-slate-600 min-w-0 max-w-[60vw]">
          <option>Yükleniyor...</option>
        </select>
      </div>
      <div id="baglanti-durum" class="text-xs font-bold px-3 py-1.5 rounded-full bg-slate-700">●&nbsp;Bağlanıyor</div>
    </div>
  </div>

  <!-- KRİTİK UYARI BANNER'I: farkeder etmez en tepede -->
  <div id="kritik-banner" class="hidden max-w-3xl mx-auto px-4 pt-4"></div>

  <div id="ana-icerik" class="max-w-3xl mx-auto px-4 pt-4 space-y-4"></div>

  <div id="hata-durumu" class="hidden max-w-3xl mx-auto px-4 pt-10 text-center">
    <div class="text-5xl mb-3">📡</div>
    <div class="text-xl font-bold">Sunucuya ulaşılamıyor</div>
    <div class="text-slate-400 mt-1">İnternet bağlantınızı kontrol edin. Son bilinen veriler gösteriliyor olabilir.</div>
    <button data-tikla="yenile" class="mt-4 bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-xl font-bold text-lg">Tekrar Dene</button>
  </div>

  <!-- HIZLI GİRİŞ (alt sabit çubuk) -->
  <div class="fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-700 px-4 py-3 z-30">
    <div class="max-w-3xl mx-auto grid grid-cols-3 gap-2">
      <button data-tikla="formAc" data-arg="hasat" class="bg-emerald-700 hover:bg-emerald-600 rounded-xl py-3 font-bold text-sm flex flex-col items-center gap-1">
        <span class="text-xl">🧺</span>Hasat Gir
      </button>
      <button data-tikla="formAc" data-arg="ilaclama" class="bg-amber-700 hover:bg-amber-600 rounded-xl py-3 font-bold text-sm flex flex-col items-center gap-1">
        <span class="text-xl">🧪</span>İlaçlama Gir
      </button>
      <button data-tikla="formAc" data-arg="gider" class="bg-sky-700 hover:bg-sky-600 rounded-xl py-3 font-bold text-sm flex flex-col items-center gap-1">
        <span class="text-xl">💰</span>Gider Gir
      </button>
    </div>
  </div>

  <!-- HIZLI GİRİŞ MODAL -->
  <div id="modal-arka-plan" class="hidden fixed inset-0 bg-black/70 z-40 flex items-end sm:items-center justify-center">
    <div id="modal-icerik" class="bg-slate-800 w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto"></div>
  </div>

<script src="/static/js/cilek.js"></script>
</body>
</html>
