<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>E-posta Doğrulama - Teşvik Asistanı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .kart { background: #fff; width: 100%; max-width: 420px; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,.3); padding: 36px 32px; text-align: center; }
        h1 { font-size: 22px; margin-bottom: 12px; color: #333; }
        #sonuc { color: #555; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
        a, button { display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: 0; border-radius: 5px; font-weight: bold; font-size: 15px; text-decoration: none; cursor: pointer; }
        button:disabled { opacity: .6; cursor: default; }
        form { margin-bottom: 18px; text-align: left; }
        form[hidden], a[hidden] { display: none; }
        label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 15px; margin-bottom: 12px; }
        input:focus { outline: none; border-color: #667eea; }
        .yardim { font-size: 13px; color: #777; margin-top: 10px; text-align: center; }
        .yardim a { padding: 0; background: none; color: #667eea; }
    </style>
</head>
<body>
<div class="kart">
    <h1>E-posta doğrulama</h1>
    <p id="sonuc">Doğrulanıyor…</p>
    <!-- Doğrulama zorunlu kayıtta sunucu 428 döner: hesabı yalnızca kaydı yapan (parolayı bilen) etkinleştirir. -->
    <form id="parola-formu" hidden>
        <label for="parola">Parolanız</label>
        <input type="password" id="parola" autocomplete="current-password" required>
        <button type="submit" id="etkinlestir">Hesabı etkinleştir</button>
        <p class="yardim">Parolanızı hatırlamıyor musunuz? <a href="/sifre-sifirla">Şifremi unuttum</a></p>
    </form>
    <a href="/dashboard" id="panel">Panele git</a>
</div>
<script src="/static/js/eposta_dogrula.js"></script>
</body>
</html>
