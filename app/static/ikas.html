<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>İKAS ile giriş - Teşvik Asistanı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .kart { background: #fff; width: 100%; max-width: 440px; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,.3); padding: 36px 32px; text-align: center; }
        h1 { font-size: 22px; margin-bottom: 12px; color: #333; }
        #sonuc { color: #555; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
        a { display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border-radius: 5px; font-weight: bold; font-size: 15px; text-decoration: none; }
        a[hidden] { display: none; }
        .yukleniyor { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid #e0e0e0; border-top-color: #667eea; border-radius: 50%; animation: don 0.8s linear infinite; }
        .yukleniyor[hidden] { display: none; }
        @keyframes don { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="kart">
    <h1>Teşvik Asistanı</h1>
    <div class="yukleniyor" id="yukleniyor"></div>
    <p id="sonuc">İKAS oturumunuz doğrulanıyor…</p>
    <a href="/dashboard" id="panel" hidden>Panele git</a>
</div>
<script src="/static/js/ikas.js"></script>
</body>
</html>
