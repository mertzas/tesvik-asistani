# Uretim dagitimi.
#
# Sirlar bu dosyada TUTULMUYOR: yanindaki .env dosyasindan okunuyor. Onceki hali
# SECRET_KEY, veritabani sifresi ve STRIPE_SECRET_KEY'i duz metin yer tutucularla
# ("your_secret_key_here_change_in_production", "sk_live_your_key_here") iceriyordu;
# bu degerler depoya islendigi icin biri degistirmeyi atlarsa uretim herkesin
# gorebildigi bir imza anahtariyla calisir. Artik zorunlu: degisken eksikse
# docker compose hata verir.
#
# Kullanim:
#   cp .env.example .env    # ve degerleri doldurun
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-tesvik_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port disariya ACILMIYOR: veritabanina yalnizca ayni ag icindeki web
    # servisi erisiyor. Onceki hali 5432'yi ana makineye aciyordu, bu da
    # veritabanini internete acik hale getirebilirdi.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tesvik_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY gerekli - "openssl rand -hex 32" ile uretin}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EVDS_API_KEY: ${EVDS_API_KEY:-}
      APP_URL: ${APP_URL:?APP_URL gerekli - OAuth callback adresleri buna dayanir}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    # Kaynak kodu bind mount EDILMIYOR: uretimde imajin icindeki kod
    # calismali. Onceki hali ./app'i baglayarak imaji anlamsiz kiliyor ve
    # sunucudaki dosyayi degistiren herkesin kodu degistirmesine izin veriyordu.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # nginx.conf sertifikalari /etc/nginx/certs altinda ARIYOR
      # (ssl_certificate /etc/nginx/certs/cert.pem). Onceki hali ./ssl'i
      # /etc/nginx/ssl'e bagliyordu; yollar uyusmadigi icin nginx hic
      # acilmiyordu. Sertifikalari ./certs altina koyun.
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped

# NOT: redis servisi kaldirildi. Kodda hicbir yerde redis kullanilmiyor
# (dogrulandi 2026-09-26: "import redis" gecen tek bir dosya yok). Bos bir
# kapsayici hem kaynak tuketiyor hem de 6379'u aciyordu. Hiz sinirlama
# sayaclari suan surec-ici (app/rate_limit.py); cok isçili dagitima
# geçildiginde redis geri eklenmesi gerekecek.

volumes:
  postgres_data:
