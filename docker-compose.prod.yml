# Uretim dagitimi.
#
# Sirlar bu dosyada TUTULMUYOR: yanindaki .env dosyasindan okunuyor. Onceki hali
# SECRET_KEY, veritabani sifresi ve STRIPE_SECRET_KEY'i duz metin yer tutucularla
# ("your_secret_key_here_change_in_production", "sk_live_your_key_here") iceriyordu;
# bu degerler depoya islendigi icin biri degistirmeyi atlarsa uretim herkesin
# gorebildigi bir imza anahtariyla calisir. Artik zorunlu: degisken eksikse
# docker compose hata verir.
#
# Kullanim:
#   cp .env.example .env    # ve degerleri doldurun
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Servisler: db (PostgreSQL), redis (hiz siniri sayaclari - cok iscili web icin
# zorunlu), web (uvicorn --workers 2; zamanlayici yalnizca kilidi alan iscide),
# backup (gunluk pg_dump, ./backups altina, RETENTION_DAYS gun tutar), nginx.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-tesvik_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port disariya ACILMIYOR: veritabanina yalnizca ayni ag icindeki web
    # servisi erisiyor. Onceki hali 5432'yi ana makineye aciyordu, bu da
    # veritabanini internete acik hale getirebilirdi.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tesvik_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY gerekli - "openssl rand -hex 32" ile uretin}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      # Yanıt servisi (app/llm_saglayici.py): varsayılan yerel danışman; Anthropic kullanılmaz.
      LLM_SAGLAYICI: ${LLM_SAGLAYICI:-yerel}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EVDS_API_KEY: ${EVDS_API_KEY:-}
      APP_URL: ${APP_URL:?APP_URL gerekli - OAuth callback adresleri buna dayanir}
      # CORS: bos birakilirsa APP_URL kullanilir (app/main.py izinli_originler).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS:-7}
      REDIS_URL: redis://redis:6379/0
      # Istemci IP'si: yalnizca nginx kapsayicisina guvenilir (asagidaki sabit IP). Hem uygulamanin hiz
      # siniri (app/rate_limit.py istemci_ip) hem uvicorn --forwarded-allow-ips (Dockerfile.prod) bunu okur.
      # Onceki hali: uvicorn yalnizca 127.0.0.1'e guveniyordu, request.client.host her ziyaretci icin
      # nginx'in IP'siydi -> login/signup/webhook IP limitleri TUM kullanicilarca paylasiliyordu.
      TRUSTED_PROXIES: ${NGINX_IP:-10.231.57.10}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      IKAS_CLIENT_ID: ${IKAS_CLIENT_ID:-}
      IKAS_CLIENT_SECRET: ${IKAS_CLIENT_SECRET:-}
      IKAS_MOCK_MODE: ${IKAS_MOCK_MODE:-true}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Kaynak kodu bind mount EDILMIYOR: uretimde imajin icindeki kod
    # calismali. Onceki hali ./app'i baglayarak imaji anlamsiz kiliyor ve
    # sunucudaki dosyayi degistiren herkesin kodu degistirmesine izin veriyordu.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Gunluk yedek: her 24 saatte pg_dump -> ./backups/tesvik_YYYYmmdd_HHMMSS.sql.gz,
  # RETENTION_DAYS gunden eskiler silinir. Geri yukleme: scripts/restore.sh (DEPLOYMENT.md).
  backup:
    image: postgres:15-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:-tesvik_db}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c 'while true; do
        f=/backups/tesvik_$(date +%Y%m%d_%H%M%S).sql.gz;
        if pg_dump -h db -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > "$$f" && gunzip -t "$$f"; then
          echo "yedek alindi: $$f";
        else
          echo "YEDEK BASARISIZ: $$f" >&2; rm -f "$$f";
        fi;
        find /backups -name "tesvik_*.sql.gz" -mtime +$$RETENTION_DAYS -delete;
        sleep 86400;
      done'
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # nginx.conf sertifikalari /etc/nginx/certs altinda ARIYOR
      # (ssl_certificate /etc/nginx/certs/cert.pem). Onceki hali ./ssl'i
      # /etc/nginx/ssl'e bagliyordu; yollar uyusmadigi icin nginx hic
      # acilmiyordu. Sertifikalari ./certs altina koyun.
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    # Sabit IP: web servisi X-Forwarded-For/X-Real-IP basliklarina YALNIZCA bu adresten gelirse guvenir.
    # Tum alt aga (ya da '*') guvenilmiyor: alt agin gecidi (.1) ana makineden gelen baglantilari temsil
    # eder; ileride web'e host portu acilirsa disaridan gelen sahte X-Forwarded-For kabul edilmesin.
    networks:
      default:
        ipv4_address: ${NGINX_IP:-10.231.57.10}
    depends_on:
      - web
    restart: unless-stopped

# Varsayilan agin alt agi sabit: nginx'e sabit IP verebilmek icin gerekli. Ana makinede bu aralik
# baska bir agla cakisirsa "docker compose up" acikca hata verir; o zaman .env'de TESVIK_ALT_AG ve
# NGINX_IP'yi birlikte degistirin. Mevcut dagitimda ilk gecis: docker compose down && up -d (ag yeniden kurulur).
networks:
  default:
    ipam:
      config:
        - subnet: ${TESVIK_ALT_AG:-10.231.57.0/24}

volumes:
  postgres_data:
