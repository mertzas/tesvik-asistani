version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tesvik_postgres
    environment:
      POSTGRES_USER: tesvik_user
      POSTGRES_PASSWORD: tesvik_password_123
      POSTGRES_DB: tesvik_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesvik_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tesvik_network

  redis:
    image: redis:7-alpine
    container_name: tesvik_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tesvik_network

  web:
    build: .
    container_name: tesvik_web
    environment:
      DATABASE_URL: postgresql://tesvik_user:tesvik_password_123@postgres:5432/tesvik_saas
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-super-secret-key-change-in-production
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    networks:
      - tesvik_network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  nginx:
    image: nginx:alpine
    container_name: tesvik_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - tesvik_network

volumes:
  postgres_data:
  redis_data:

networks:
  tesvik_network:
    driver: bridge
