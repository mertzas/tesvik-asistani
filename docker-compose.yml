# Yerel gelistirme icin PostgreSQL'li kurulum.
#
# BUNA IHTIYACINIZ YOK: yerel gelistirmede uygulama SQLite ile calisir, tek
# komutla yeter (bkz. README.md). Bu dosya yalnizca uretimdeki PostgreSQL
# davranisini yerelde denemek istediginizde gereklidir.
#
# Uretim dagitimi icin docker-compose.prod.yml kullanin.

services:
  postgres:
    image: postgres:15-alpine
    container_name: tesvik_postgres
    environment:
      POSTGRES_USER: tesvik_user
      # Yerel gelistirme sifresi - bu dosya UYGULAMAYA ACIK DEGIL, yalnizca
      # localhost'ta calisir. Uretim sirlari docker-compose.prod.yml'de
      # .env'den okunur, asla dosyaya yazilmaz.
      POSTGRES_PASSWORD: tesvik_local_dev
      POSTGRES_DB: tesvik_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesvik_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tesvik_network

  web:
    build: .
    container_name: tesvik_web
    environment:
      DATABASE_URL: postgresql://tesvik_user:tesvik_local_dev@postgres:5432/tesvik_saas
      SECRET_KEY: yerel-gelistirme-anahtari-uretimde-kullanma
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EVDS_API_KEY: ${EVDS_API_KEY:-}
      APP_URL: http://localhost:8000
      # ENVIRONMENT su an kodda HIC okunmuyor (dogrulandi 2026-09-26) - yalnizca
      # belgeleyici bir isaret. Ortama gore davranis eklenirse bu deger anlam
      # kazanacak; o yuzden yerelde bilerek "development" yaziyor (onceki hali
      # yerel dosyada "production" diyordu).
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - tesvik_network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:

networks:
  tesvik_network:
    driver: bridge

# NOT: redis ve nginx servisleri kaldirildi. Redis kodda hic kullanilmiyor
# (dogrulandi 2026-09-26). Nginx yerel gelistirmede gereksiz bir ara katman;
# uretim icin docker-compose.prod.yml'de duruyor.
