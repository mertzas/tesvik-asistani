user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # En buyuk istek govdesi: /api/sor 500 karakter, profil formu kucuk; dosya yuklemesi yok.
    client_max_body_size 1M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting (uygulama katmaninda org/IP bazli siniri ayrica var)
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # WebSocket/upgrade basligi yalnizca istemci istediyse iletilir; aksi halde bos
    # Connection basligi keepalive'i bozmaz.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream
    upstream web {
        server web:8000;
    }

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }

        # Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name tesvikasistani.com www.tesvikasistani.com;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # HSTS yalnizca burada: diger guvenlik basliklari (X-Frame-Options DENY,
        # X-Content-Type-Options, Referrer-Policy, Permissions-Policy) uygulamadan gelir.
        # Onceki hali X-Frame-Options SAMEORIGIN de ekliyor, uygulamanin DENY'iyle
        # cift/celiskili baslik olusuyordu; X-XSS-Protection ise artik tarayicilarca
        # yok sayilan, hatta zararli olabilen bir baslik (2026-10-07 denetimi).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # /static/ uygulama tarafindan (StaticFiles) sunulur. Onceki hali
        # "alias /app/app/static/" ile nginx kapsayicisinda BULUNMAYAN bir dizine
        # isaret ediyordu (compose nginx'e kaynak kodu baglamiyor) -> her statik
        # dosya 404.

        # API endpoints
        location /api/ {
            limit_req zone=api burst=200 nodelay;

            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # /api/sor/akis SSE akisi: tamponlama kapali, danisman yaniti 35-70 sn surebilir
            # (olcum 2026-10-07); varsayilan 60 sn read timeout akisi ortadan kesiyordu.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Health check
        location /health {
            proxy_pass http://web/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # Root path (sayfalar + /static/)
        location / {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
