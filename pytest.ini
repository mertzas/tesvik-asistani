[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    canli_llm: gercek Claude API'sine cikan testler (varsayilan olarak taklit edilir, bkz. tests/conftest.py)
# asyncio_mode kaldirildi: pytest-asyncio kurulu degil ve testlerin hicbiri
# async degil; pytest her calistirmada "Unknown config option: asyncio_mode"
# uyarisi veriyordu. Async test eklenirse pytest-asyncio'yu
# requirements-dev.txt'e ekleyip bu satiri geri acin.
